<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oil Management</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1721;color:#eaf2f6;font:15px system-ui}main{max-width:950px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:24px}h2{font-size:18px}.muted{color:#9bafbd}.card{background:#1a2937;border:1px solid #304456;border-radius:16px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#11202d;border-radius:12px;padding:13px}.stat b{display:block;font-size:20px;margin-top:7px}.stat small{color:#9bafbd}.btn{border:0;border-radius:10px;background:#18a084;color:white;padding:12px 16px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.45}.secondary{background:#2d4b60}.tabs{display:flex;overflow:auto;gap:7px}.tabs button{background:#233746;border:1px solid #3b5668;border-radius:10px;padding:11px;color:white;white-space:nowrap}.tabs .active{background:#178e78}input,select{width:100%;padding:12px;background:#10202b;border:1px solid #3b5668;border-radius:9px;color:white}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:13px;color:#bdcbd4}.row{display:flex;justify-content:space-between;border-bottom:1px solid #304456;padding:12px 0;gap:12px}.row:last-child{border:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.hide{display:none}.bars{display:flex;align-items:end;gap:5px;height:130px;border-bottom:1px solid #678}.bars div{flex:1;background:#24a78d;border-radius:4px 4px 0 0}.notice{background:#294154;border-radius:10px;padding:12px;margin:12px 0}.bad{color:#ff9292}.good{color:#7cdeb5}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.fields{grid-template-columns:1fr}.stat b{font-size:16px}main{padding:12px}}</style></head><body><main><header><div><b>◈ OIL MANAGEMENT</b><div class="muted">Petroleum Simulator · v0.1</div></div><small class="good">AUTO SAVE</small></header><section id="setup" class="card"><h1>Создание компании</h1><p class="muted">Вымышленная география. Все финансовые и производственные параметры пока игровые.</p><div class="fields"><label>Название компании<input id="name" value="Каспий Петролеум"></label><label>Регион<input id="region" value="Сарытау"></label><label>Месторождение<input id="field" value="Каражол"></label><label>Начальный капитал<select id="capital"><option value="1500">1,5 млрд ₸</option><option value="5000" selected>5 млрд ₸</option><option value="15000">15 млрд ₸</option></select></label></div><div class="actions"><button class="btn" id="new">Создать компанию</button><button class="btn secondary hide" id="load">Продолжить игру</button></div></section><div id="game" class="hide"><section class="card"><small id="where" class="muted"></small><h1 id="title"></h1><div id="period" class="muted"></div><div id="stats" class="grid" style="margin-top:15px"></div><div class="actions"><button id="next" class="btn">Следующий месяц →</button></div></section><nav class="tabs" id="tabs"><button data-tab="overview" class="active">Обзор</button><button data-tab="field">Месторождение</button><button data-tab="finance">Финансы</button><button data-tab="hse">HSE</button><button data-tab="events">События</button></nav><section class="card" id="body"></section><button class="btn secondary" id="reset">Новая карьера</button></div><p class="muted" style="font-size:11px">Учебная игровая модель, не технический или финансовый расчёт.</p></main><script>
(()=>{const KEY='oil-management-v01';let s=null,tab='overview';const $=x=>document.getElementById(x),f=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(n),m=n=>f(n)+' млн ₸',esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),cl=(n,a,b)=>Math.min(b,Math.max(a,n)),r=(a,b)=>a+Math.random()*(b-a);function save(){localStorage.setItem(KEY,JSON.stringify(s))}function log(t){s.events.unshift('Месяц '+s.month+': '+t);s.events=s.events.slice(0,60)}function show(){$('setup').classList.add('hide');$('game').classList.remove('hide');render()}function row(a,b){return '<div class="row"><span class="muted">'+a+'</span><b>'+b+'</b></div>'}function stat(a,b){return '<div class="stat"><small>'+a+'</small><b>'+b+'</b></div>'}function action(t){const x={drill:[950,'Начато бурение скважины'],repair:[180,'Капитальный ремонт фонда'],service:[80,'Плановое техобслуживание'],hse:[65,'Обучение и профилактика HSE'],survey:[110,'Геологическое исследование']}[t];if(!x||s.cash<x[0])return alert('Недостаточно средств');s.cash-=x[0];if(t==='drill')s.pending.push(2);if(t==='repair'){s.condition=cl(s.condition+16,0,100);s.rate+=.5}if(t==='service')s.condition=cl(s.condition+10,0,100);if(t==='hse')s.safety=cl(s.safety+14,0,100);if(t==='survey')s.rate+=.15;log(x[1]+' — '+m(x[0]));save();render()}function next(){if(s.dead)return;s.month++;s.pending=s.pending.map(n=>n-1);let done=s.pending.filter(n=>n===0).length;s.pending=s.pending.filter(n=>n>0);for(let i=0;i<done;i++){if(Math.random()<.82){s.wells++;log('Новая скважина успешно запущена')}else log('Бурение не дало промышленного притока')}s.oil=cl(s.oil+r(-18,18),45,115);s.usd=cl(s.usd+r(-12,12),380,600);s.water=cl(s.water+r(.1,.8),0,95);s.condition=cl(s.condition-r(1.5,3),0,100);s.safety=cl(s.safety-r(.5,2),0,100);s.rate=cl(s.rate-r(.05,.2),2,30);let downtime=cl((100-s.condition)*.004,0,.65);if(Math.random()<(100-s.safety)*.0015){downtime+=.2;s.cash-=55;log('Инцидент: внеплановый простой, расходы 55 млн ₸')}s.volume=s.wells*s.rate*30*(1-s.water/100)*(1-downtime);s.revenue=s.volume*7.3*s.oil*s.usd/1e6*.79;s.expense=s.wells*7.5+45+s.volume*.006;s.profit=s.revenue-s.expense;s.cash+=s.profit;s.history.push({volume:s.volume,profit:s.profit});if(s.cash<0){s.dead=true;log('Неплатёжеспособность: карьера завершена')}save();render()}function render(){$('title').textContent=s.name;$('where').textContent=s.region+' · '+s.field;$('period').textContent=new Date(2026,s.month,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'})+' · '+s.wells+' скважин';$('stats').innerHTML=stat('Денежные средства',m(s.cash))+stat('Добыча / месяц',f(s.volume)+' т')+stat('Прибыль / месяц',m(s.profit))+stat('Нефть', '$'+f(s.oil)+'/барр.');$('next').disabled=s.dead;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let h='';if(tab==='overview'){h='<h2>Панель директора</h2>'+row('Скважины',s.wells)+row('Обводнённость',f(s.water)+'%')+row('Состояние оборудования',f(s.condition)+'%')+row('Индекс HSE',f(s.safety)+'%')+'<h2>Добыча за последние 12 месяцев</h2>';let a=s.history.slice(-12),max=Math.max(1,...a.map(x=>x.volume));h+=a.length?'<div class="bars">'+a.map(x=>'<div title="'+f(x.volume)+' тонн" style="height:'+Math.max(2,x.volume/max*100)+'%"></div>').join('')+'</div>':'<p class="muted">Нажми «Следующий месяц», чтобы получить первый результат.</p>';h+='<div class="notice">'+esc(s.events[0])+'</div>'}if(tab==='field')h='<h2>Месторождение «'+esc(s.field)+'»</h2>'+row('Действующие скважины',s.wells)+row('Потенциальный дебит',f(s.rate)+' т/сут на скважину')+row('Обводнённость',f(s.water)+'%')+row('Техническое состояние',f(s.condition)+'%')+row('Бурение в работе',s.pending.length)+'<p class="muted">Новая скважина строится два месяца и имеет геологический риск.</p><div class="actions">'+btn('drill','Бурение',950)+btn('repair','Капремонт',180)+btn('service','ТО',80)+btn('survey','Геология',110)+'</div>';if(tab==='finance')h='<h2>Финансовый отчёт</h2>'+row('Выручка',m(s.revenue))+row('Операционные расходы',m(s.expense))+row('Прибыль',m(s.profit))+row('Денежные средства',m(s.cash))+row('USD/KZT',f(s.usd))+'<div class="notice">Упрощённая экономика: цена нефти, курс, добыча, условная доля реализации и расходы. Налоги, амортизация и лицензирование пока не моделируются.</div>';if(tab==='hse')h='<h2>Безопасность и надёжность</h2>'+row('Индекс HSE',f(s.safety)+'%')+row('Состояние оборудования',f(s.condition)+'%')+'<p class="muted">Износ увеличивает простои, слабая профилактика повышает вероятность инцидентов.</p><div class="actions">'+btn('hse','Профилактика HSE',65)+btn('service','Плановое ТО',80)+'</div>';if(tab==='events')h='<h2>Журнал событий</h2>'+s.events.map(x=>'<div class="row">'+esc(x)+'</div>').join('');if(s.dead)h='<div class="notice bad">Компания неплатёжеспособна. Начни новую карьеру.</div>'+h;$('body').innerHTML=h;document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action))}function btn(t,label,cost){return '<button class="btn secondary" data-action="'+t+'" '+(s.cash<cost||s.dead?'disabled':'')+'>'+label+' · '+m(cost)+'</button>'}$('new').onclick=()=>{if(s&&!confirm('Заменить текущую карьеру?'))return;s={name:$('name').value.trim()||'Моя компания',region:$('region').value.trim()||'Мой регион',field:$('field').value.trim()||'Моё месторождение',cash:+$('capital').value,month:0,wells:12,rate:18,water:28,condition:88,safety:82,oil:75,usd:475,volume:0,revenue:0,expense:0,profit:0,pending:[],history:[],events:['Компания создана'],dead:false};save();show()};$('load').onclick=()=>{try{s=JSON.parse(localStorage.getItem(KEY));show()}catch(e){alert('Не удалось открыть сохранение')}};$('next').onclick=next;$('reset').onclick=()=>{if(confirm('Вернуться к созданию компании?')){$('game').classList.add('hide');$('setup').classList.remove('hide');$('load').classList.remove('hide')}};$('tabs').onclick=e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}};if(localStorage.getItem(KEY))$('load').classList.remove('hide')})();
</script></body></html>
