</style></head><body><div class="v11shell"><aside id="v11side" class="v11sidebar hide"><div class="v11brand">◈ OIL MANAGEMENT</div><div id="v11sideitems"></div><div style="padding:12px;font-size:11px;color:#87a8b8">v1.1 · симуляция</div></aside><main class="v11content"><header><div><b>◈ OIL MANAGEMENT</b><div class="muted">Enterprise Simulator · v1.1</div></div><small class="good">AUTO SAVE</small></header><section id="setup" class="card"><h1>Создание компании</h1><p class="muted">Вымышленная география. Все финансовые и производственные параметры пока игровые.</p><div class="fields"><label>Название компании<input id="name" value="Каспий Петролеум"></label><label>Регион<input id="region" value="Сарытау"></label><label>Месторождение<input id="field" value="Каражол"></label><label>Начальный капитал<select id="capital"><option value="1500">1,5 млрд ₸</option><option value="5000" selected>5 млрд ₸</option><option value="15000">15 млрд ₸</option></select></label></div><div class="actions"><button class="btn" id="new">Создать компанию</button><button class="btn secondary hide" id="load">Продолжить игру</button></div></section><div id="game" class="hide"><section class="card"><small id="where" class="muted"></small><h1 id="title"></h1><div id="period" class="muted"></div><div id="stats" class="grid" style="margin-top:15px"></div><div class="actions"><button id="next" class="btn">Следующий день →</button></div><div class="v11time"><button data-v11-step="1">+1 день</button><button data-v11-step="7">+7 дней</button><button data-v11-step="month">+1 месяц</button><button data-v11-step="year">+1 год</button><button data-v11-sound="1">🔊 Звук: вкл.</button><button data-v11-tab="inbox">✉ Входящие</button></div></section><nav class="tabs" id="tabs" style="display:none"><button data-tab="daily">День · План-факт</button><button data-tab="people">Мотивация · рейтинги</button><button data-tab="incidents">Происшествия · надзор</button><button data-tab="overview" class="active">Обзор</button><button data-tab="dispatch">Диспетчерская</button><button data-tab="assetsTree">Объекты · ГУ · скважины</button><button data-tab="field">Месторождение</button><button data-tab="finance">Финансы</button><button data-tab="hse">HSE</button><button data-tab="plan">План добычи</button><button data-tab="contracts">Подрядчики</button><button data-tab="staff">Персонал · СП/ПСП</button><button data-tab="ecology">Экология</button><button data-tab="org">Структура</button><button data-tab="warehouse">Склад · МТО</button><button data-tab="equipment">Оборудование · ОТУ</button><button data-tab="workshops">Цеха · KPI</button><button data-tab="decisions">Решения · события</button><button data-tab="events">События</button></nav><section class="card" id="body"></section><button class="btn secondary" id="reset">Новая карьера</button></div><p class="muted" style="font-size:11px">Учебная игровая модель, не технический или финансовый расчёт.</p></main></div><script>
(()=>{const KEY='oil-management-v01';let s=null,tab='overview';const $=x=>document.getElementById(x),f=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(n),m=n=>f(n)+' млн ₸',esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),cl=(n,a,b)=>Math.min(b,Math.max(a,n)),r=(a,b)=>a+Math.random()*(b-a);function save(){localStorage.setItem(KEY,JSON.stringify(s))}function log(t){s.events.unshift('Месяц '+s.month+': '+t);s.events=s.events.slice(0,60)}function show(){$('setup').classList.add('hide');$('game').classList.remove('hide');render()}function row(a,b){return '<div class="row"><span class="muted">'+a+'</span><b>'+b+'</b></div>'}function stat(a,b){return '<div class="stat"><small>'+a+'</small><b>'+b+'</b></div>'}function action(t){const x={drill:[950,'Начато бурение скважины'],repair:[180,'Капитальный ремонт фонда'],service:[80,'Плановое техобслуживание'],hse:[65,'Обучение и профилактика HSE'],survey:[110,'Геологическое исследование']}[t];if(!x||s.cash<x[0])return alert('Недостаточно средств');s.cash-=x[0];if(t==='drill')s.pending.push(2);if(t==='repair'){s.condition=cl(s.condition+16,0,100);s.rate+=.5}if(t==='service')s.condition=cl(s.condition+10,0,100);if(t==='hse')s.safety=cl(s.safety+14,0,100);if(t==='survey')s.rate+=.15;log(x[1]+' — '+m(x[0]));save();render()}function next(){if(s.dead)return;s.month++;assetMonth();treeMonth();s.pending=s.pending.map(n=>n-1);let done=s.pending.filter(n=>n===0).length;s.pending=s.pending.filter(n=>n>0);for(let i=0;i<done;i++){if(Math.random()<.82){s.wells++;log('Новая скважина успешно запущена')}else log('Бурение не дало промышленного притока')}s.oil=cl(s.oil+r(-18,18),45,115);s.usd=cl(s.usd+r(-12,12),380,600);s.water=cl(s.water+r(.1,.8),0,95);s.condition=cl(s.condition-r(1.5,3),0,100);s.safety=cl(s.safety-r(.5,2),0,100);s.rate=cl(s.rate-r(.05,.2),2,30);let downtime=cl((100-s.condition)*.004,0,.65);if(Math.random()<(100-s.safety)*.0015){downtime+=.2;s.cash-=55;log('Инцидент: внеплановый простой, расходы 55 млн ₸')}ensureAssets();s.assets.wellList.forEach(w=>{w.health=Math.max(10,Math.round(w.health-(1+Math.random()*3)));w.water=Math.min(95,Math.round(w.water+Math.random()*1.3));w.rate=Math.max(1,Math.round((w.rate-.08-Math.random()*.12)*10)/10)});let activeRatio=s.assets.wellList.filter(w=>w.status==='Работает').length/Math.max(1,s.wells);s.volume=s.wells*s.rate*30*(1-s.water/100)*(1-downtime)*activeRatio;s.revenue=s.volume*7.3*s.oil*s.usd/1e6*.79;s.expense=s.wells*7.5+45+s.volume*.006;s.profit=s.revenue-s.expense;s.cash+=s.profit;s.history.push({volume:s.volume,profit:s.profit});enterpriseMonth();opsMonth();if(s.enterprise&&s.enterprise.hr)hrMonth();if(s.cash<0){s.dead=true;log('Неплатёжеспособность: карьера завершена')}save();render()}function ensureAssets(){if(!s.assets)s.assets={};if(!s.assets.wellList)s.assets.wellList=[];while(s.assets.wellList.length<s.wells){let n=s.assets.wellList.length+1;s.assets.wellList.push({id:1000+n,unit:'ГУ-'+(1+Math.floor((n-1)/4)),status:'Работает',rate:Math.round((s.rate||18)*(0.75+Math.random()*.5)*10)/10,water:Math.round(Math.min(95,Math.max(2,(s.water||28)+(Math.random()-.5)*18))),health:Math.round(Math.min(100,Math.max(20,(s.condition||88)+(Math.random()-.5)*22)))})}if(s.assets.wellList.length>s.wells)s.assets.wellList.length=s.wells;if(!s.assets.infrastructure)s.assets.infrastructure=[{id:'ГУ-1',type:'Групповая установка',health:92},{id:'ГУ-2',type:'Групповая установка',health:88},{id:'ГУ-3',type:'Групповая установка',health:90},{id:'ДНС-1',type:'Дожимная насосная станция',health:86},{id:'ЦППН',type:'Подготовка нефти',health:91},{id:'ППД-1',type:'Поддержание пластового давления',health:83}];}function dispatchAction(id,act){ensureAssets();let w=s.assets.wellList.find(x=>x.id===Number(id));if(!w)return;let cost=act==='repair'?42:act==='stop'?0:0;if(s.cash<cost)return alert('Недостаточно средств');if(act==='repair'){s.cash-=cost;w.health=Math.min(100,w.health+35);w.status='Работает';log function ensurePlant(){if(!s.plant){s.plant={types:PLANT_TYPES.map((x,i)=>({id:i,name:x[0],qty:x[1],expired:x[2],extended:x[3],price:x[4],condition:75+(i*7)%20,maintenance:0,renewed:0})),stock:STOCK_TYPES.map((x,i)=>({id:i,name:x[0],qty:x[1],minimum:x[2],price:x[3],consumed:0})),history:[],investment:0,warehouseSpend:0,selected:0,warning:'Сводные количества взяты из документов ПУ «Сарытаунефть» на октябрь 2026 года. В игровой карьере они используются как справочная стартовая модель и не являются текущими данными предприятия.'};save()}return s.plant}

function plantAction(action,id){let p=ensurePlant(),a=p.types.find(x=>x.id===id),x=p.stock.find(x=>x.id===id);if(action==='buy'){let n=Number(prompt('Количество к закупке:',x.minimum));if(!Number.isInteger(n)||n<=0||n>100000)return;let cost=n*x.price;if(s.cash<cost)return alert('Недостаточно средств. Требуется '+m(cost));s.cash-=cost;p.warehouseSpend+=cost;x.qty+=n;plantRecord('Закуплено: '+x.name+' — '+n+' ед. за '+m(cost))}

function opsMonth(){let o=ensureOperations(),e=ensureEnterprise(),a=s.assets?.wellList||[];let active=a.filter(x=>x.status==='Работает');let total=active.reduce((sum,w)=>sum+w.rate*(1-w.water/100)*30,0);let alloc=total>0?active.map(w=>({unit:w.unit,qty:w.rate*(1-w.water/100)*30})):[];let production=s.volume;let shopWeights=o.shops.slice(0,4).map((_,i)=>alloc.filter(w=>{let n=parseInt((w.unit||'').split('-')[1],10)||1;return (n-1)%4===i}).reduce((v,w)=>v+w.qty,0));let sum=shopWeights.reduce((a,b)=>a+b,0);if(!sum)shopWeights=[.25,.25,.25,.25],sum=1;

function opsDecision(id,option){let o=ensureOperations(),c=o.cases.find(x=>x.id===id);if(!c||c.status!=='Ожидает решения')return;let op=c.options[option];if(!op)return;let [label,kind,cost]=op;if(s.cash<cost)return alert('Недостаточно денежных средств');s.cash-=cost;s.expense+=cost;s.profit-=cost;let residual=kind==='repair'?c.loss*.18:kind==='replace'?c.loss*.10:kind==='penalty'?c.loss*.55:kind==='transfer'?c.loss*.38:kind==='audit'?c.loss*.42:c.loss*.70;let recovery=c.loss-residual;s.cash-=residual;s.profit-=residual;o.losses+=residual;o.prevented+=recovery;let sh=o.shops[c.shop];if(kind==='replace'){s.condition=cl(s.condition+4,0,100);sh.invested+=cost}else if(kind==='repair'){s.condition=cl(s.condition+1.8,0,100)}else if(kind==='audit'){sh.discipline=cl(sh.discipline+3,0,100)}else if(kind==='penalty'){let compensated=Math.min(3,c.loss*.2);s.cash+=compensated;o.prevented+=compensated}if(c.key==='ppe'||c.key==='safety')s.safety=cl(s.safety+(kind==='repair'||kind==='replace'?2:.5),0,100);c.status='Решено';c.decision=label;c.residual=Math.round(residual*10)/10;c.cost=cost;c.closedMonth=s.month;o.closed.unshift(c);o.closed=o.closed.slice(0,80);o.cases=o.cases.filter(x=>x.id!==id);o.logs.unshift('Мес. '+s.month+': '+sh.name+' — '+label+' по событию «'+c.title+'»; потери '+m(residual));log('Решение по '+sh.name+': '+label+' · '+m(cost));save();render()}

function v11beep(type='click'){if(!v11sound)return;try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;let c=new C(),o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=type==='alarm'?440:type==='success'?740:520;g.gain.setValueAtTime(.045,c.currentTime);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.13);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.14);setTimeout(()=>c.close(),300)}catch(e){}}
function v11init(){let v=v8init();if(!s.v11)s.v11={employees:[],marketDay:0,actions:[],inbox:[],hired:0};let z=s.v11;z.employees||=[];z.inbox||=[];z.actions||=[];if(!z.employees.length){let names=['Ерлан Серикович Нурланов','Болат Маратович Смагулов','Нуржан Ермекович Бекетов','Алия Кайратовна Омарова','Мадина Сериковна Жумабаева','Руслан Талгатович Ахметов'];z.employees=names.map((name,i)=>({id:100+i,name,sex:i===3||i===4?'Ж':'М',birth:1969+i*5,experience:Math.max(1,27-i*3),job:i<3?'Начальник производственного участка':'Руководитель службы',salary:750000+i*90000,skills:cl(75+i*3,0,100),discipline:cl(92-i*5,0,100),leadership:cl(76+i*2,0,100),weak:i%2?'Сложности с делегированием':'Нуждается в развитии цифровых навыков',strong:i%2?'Техническая экспертиза':'Организованность',status:'Работает'}))}return z}

function v11market(){let v=v8init(),z=v11init(),n=(v.year-2022)*365+v.daysElapsed;let ref={2022:100.9,2023:82.5,2024:80.5,2025:69.1,2026:70};let yr=ref[v.year]||Math.max(38,75+15*Math.sin((v.year-2026)*.41));let oil=cl(yr+7*Math.sin(n/31)+3*Math.sin(n/9),28,180);let fx=cl((v.year===2022?461:v.year===2023?456:v.year===2024?469:v.year===2025?521:510+(v.year-2026)*3)+15*Math.sin(n/27)+6*Math.sin(n/7),330,950);s.oil=oil;s.usd=fx;return {oil,fx}}
function v11step(n){if(v11busy||s.dead)return;v11busy=true;let limit=typeof n==='number'?n:n==='month'?new Date(s.v8.year,v8idx()+1,0).getDate()-s.v8.day+1:(new Date(s.v8.year+1,0,1)-new Date(s.v8.year,v8idx(),s.v8.day))/86400000;limit=Math.min(366,Math.max(1,Math.round(limit)));let count=0;function tick(){if(count>=limit||s.dead){v11busy=false;v11beep('success');render();return}let old=s.v8.incidents.length;v11market();v8advance();count++;let v=s.v8;if(v.incidents.length>old){v11busy=false;v11beep('alarm');tab='inbox';render();alert('Критическое событие: переход времени остановлен. Проверьте входящие и происшествия.');return}if(count%25===0)setTimeout(tick,0);else tick()}tick()}

function v11personAction(id,act){let z=v11init(),p=z.employees.find(x=>x.id===id);if(!p)return;let costs={bonus:p.salary/1e6,train:2,raise:0,dismiss:0};if(s.cash<costs[act])return alert('Недостаточно средств');if(act==='dismiss'){let reason=prompt('Основание для начала кадровой процедуры (не является автоматическим увольнением):');if(!reason?.trim())return;z.actions.unshift(v8date()+': инициирована проверка кадрового основания по '+p.name+': '+reason);z.inbox.unshift('Кадровая служба: проверить основания и документы для решения по '+p.name);alert('Создано кадровое поручение. Увольнение не выполнено автоматически.')}else if(act==='raise'){p.salary=Math.round(p.salary*1.05);z.actions.unshift('Повышен оклад '+p.name+' до '+f(p.salary)+' ₸')}else{s.cash-=costs[act];if(act==='train')p.skills=cl(p.skills+4,0,100);if(act==='bonus')s.v8.morale=cl(s.v8.morale+1,0,100);z.actions.unshift((act==='train'?'Обучение: ':'Премия: ')+p.name)}v11beep('success');save();render()}
function v11leaderAction(act){let p=[...s.v8.rankCity,...s.v8.rankField].find(x=>x.name===v11focus);if(!p)return;let cost=act==='bonus'?2:act==='train'?1:0;if(s.cash<cost)return alert('Недостаточно средств');if(act==='dismiss'){let reason=prompt('Причина инициирования процедуры (не автоматическое увольнение):');if(!reason?.trim())return;s.v11.inbox.unshift('Кадровое поручение: проверить основания по '+p.name+' — '+reason)}else if(act==='plan'){let reason=prompt('План улучшений для '+p.name+':');if(!reason?.trim())return;s.v11.inbox.unshift('План улучшений: '+p.name+' — '+reason)}else{s.cash-=cost;p.score=cl(p.score+(act==='train'?3:1),0,100)}s.v11.actions.unshift(v8date()+': '+act+' · '+p.name);v11beep('success');save();render()}
function v11hire(i){let list=[['Арман Серикович Байжанов','М',1991,11,87,84,740000,'Умеет организовать ремонт','Ограниченный опыт управления'],['Тимур Ермекович Абилов','М',1984,18,94,69,920000,'Большой опыт в добыче','Конфликтность'],['Асель Маратовна Сейтова','Ж',1997,5,77,95,580000,'Внимательность и обучаемость','Небольшой стаж']];let x=list[i],z=v11init();if(z.employees.some(p=>p.name===x[0]&&p.status==='Работает'))return alert('Кандидат уже принят');let job=prompt('Должность для кандидата '+x[0]+':','Инженер');if(!job?.trim())return;if(!confirm('Принять '+x[0]+' на должность '+job+' с окладом '+f(x[6])+' ₸?'))return;z.employees.push({id:Date.now(),name:x[0],sex:x[1],birth:x[2],experience:x[3],skills:x[4],discipline:x[5],leadership:65,salary:x[6],strong:x[7],weak:x[8],job:job.trim(),status:'Работает'});z.inbox.unshift('Принят сотрудник '+x[0]+' · '+job);save();v11beep('success');render()}

function render() {normalizeFiction();v8init();v11init();v11market();ensureTree();ensureOperations();ensurePlant();ensureAssets();ensureEnterprise();$('title').textContent=s.name;$('where').textContent=s.region+' · '+s.field;$('period').textContent=v8date()+' · '+s.wells+' скважин';$('stats').innerHTML=stat('Денежные средства',m(s.cash))+stat('Добыча прошлого месяца',f(s.volume)+' т')+stat('Прибыль / месяц',m(s.profit))+stat('Нефть', '$'+f(s.oil)+'/барр.');$('next').disabled=s.dead;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let h='';if(tab==='daily')h=v8dailyView();if(tab==='inbox')h=v11inbox();if(tab==='career')h=v11career();if(tab==='market')h=v11marketView();if(tab==='people')h=v11rank();if(tab==='people')h=v8peopleView();if(tab==='incidents')h=v8incidentsView();if(tab==='dispatch')h=dispatchView();if(tab==='assetsTree')h=treeView();if(tab==='workshops')h=opsView();if(tab==='decisions')h=decisionsView();if(['plan','contracts','ecology','org'].includes(tab))h=enterpriseView();if(tab==='staff')h=hrView();if(tab==='warehouse')h=warehouseView();if(tab==='equipment')h=equipmentView();if(tab==='overview'){h='<h2>Панель директора</h2>'+row('Скважины',s.wells)+row('Обводнённость',f(s.water)+'%')+row('Состояние оборудования',f(s.condition)+'%')+row('Индекс HSE',f(s.safety)+'%')+'<h2>Добыча за последние 12 месяцев</h2>';let a=s.history.slice(-12),max=Math.max(1,...a.map(x=>x.volume));h+=a.length?'<div class="bars">'+a.map(x=>'<div title="'+f(x.volume)+' тонн" style="height:'+Math.max(2,x.volume/max*100)+'%"></div>').join('')+'</div>':'<p class="muted">Нажми «Следующий день», чтобы получить первый результат.</p>';h+='<div class="notice">'+esc(s.events[0])+'</div>'}if(tab==='field')h='<h2>Месторождение «'+esc(s.field)+'»</h2>'+row('Действующие скважины',s.wells)+row('Потенциальный дебит',f(s.rate)+' т/сут на скважину')+row('Обводнённость',f(s.water)+'%')+row('Техническое состояние',f(s.condition)+'%')+row('Бурение в работе',s.pending.length)+'<p class="muted">Новая скважина строится два месяца и имеет геологический риск.</p><div class="actions">'+btn('drill','Бурение',950)+btn('repair','Капремонт',180)+btn('service','ТО',80)+btn('survey','Геология',110)+'</div>';if(tab==='finance')h='<h2>Финансовый отчёт</h2>'+row('Выручка',m(s.revenue))+row('Операционные расходы',m(s.expense))+row('Прибыль',m(s.profit))+row('Денежные средства',m(s.cash))+row('USD/KZT',f(s.usd))+'<div class="notice">Упрощённая экономика: цена нефти, курс, добыча, условная доля реализации и расходы. Налоги, амортизация и лицензирование пока не моделируются.</div>';if(tab==='hse')h='<h2>Безопасность и надёжность</h2>'+row('Индекс HSE',f(s.safety)+'%')+row('Состояние оборудования',f(s.condition)+'%')+'<p class="muted">Износ увеличивает простои, слабая профилактика повышает вероятность инцидентов.</p><div class="actions">'+btn('hse','Профилактика HSE',65)+btn('service','Плановое ТО',80)+'</div>';if(tab==='events')h='<h2>Журнал событий</h2>'+s.events.map(x=>'<div class="row">'+esc(x)+'</div>').join('');if(s.dead)h='<div class="notice bad">Компания неплатёжеспособна. Начни новую карьеру.</div>'+h;$('body').innerHTML=v11hero()+h;v8bind();v11bind();if(tab==='staff')hrBind();if(tab==='assetsTree')treeBind();if(tab==='workshops'||tab==='decisions')opsBind();if(tab==='warehouse'||tab==='equipment')assetBind();document.querySelectorAll('[data-enterprise]').forEach(b=>b.onclick=()=>enterpriseAct(b.dataset.enterprise,b.dataset.arg));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-well]').forEach(b=>b.onclick=()=>dispatchAction(b.dataset.well,b.dataset.op))}function btn(t,label,cost){return '<button class="btn secondary" data-action="'+t+'" '+(s.cash<cost||s.dead?'disabled':'')+'>'+label+' · '+m(cost)+'</button>'}$('new').onclick=()=>{if(s&&!confirm('Заменить текущую карьеру?'))return;s={name:$('name').value.trim()||'Моя компания',region:$('region').value.trim()||'Мой регион',field:$('field').value.trim()||'Моё месторождение',cash:+$('capital').value,month:0,wells:12,rate:18,water:28,condition:88,safety:82,oil:75,usd:475,volume:0,revenue:0,expense:0,profit:0,pending:[],history:[],events:['Компания создана'],dead:false};save();show()};$('load').onclick=()=>{try{s=JSON.parse(localStorage.getItem(KEY));show()}catch(e){alert('Не удалось открыть сохранение')}};$('next').onclick=()=>v11step(1);$('reset').onclick=()=>{if(confirm('Вернуться к созданию компании?')){$('game').classList.add('hide');$('setup').classList.remove('hide');$('load').classList.remove('hide')}};$('tabs').onclick=e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}};if(localStorage.getItem(KEY))$('load').classList.remove('hide');
/* v1.2: save manager. Compatible with the existing v0.1-v1.1 localStorage key. */
const BACKUP_KEY=KEY+'-backup';
const fileInput=document.createElement('input');fileInput.type='file';fileInput.accept='.json,application/json';fileInput.style.display='none';document.body.appendChild(fileInput);
const saveBar=document.createElement('div');saveBar.id='save-manager';saveBar.innerHTML='<strong>💾 Сохранения</strong><button type="button" id="save-now">Сохранить</button><button type="button" id="save-export">Скачать JSON</button><button type="button" id="save-import">Загрузить JSON</button><button type="button" id="save-restore">Резервная копия</button><small id="save-status" aria-live="polite">Автосохранение включено</small>';
document.body.appendChild(saveBar);
const style=document.createElement('style');style.textContent='#save-manager{position:fixed;right:12px;bottom:12px;z-index:9999;display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:min(95vw,850px);background:#122536;border:1px solid #477080;border-radius:12px;padding:10px;box-shadow:0 12px 40px #0009;color:#eef7fa;font:12px system-ui}#save-manager button{border:1px solid #477080;background:#254659;color:#fff;border-radius:7px;padding:8px;cursor:pointer}#save-manager button:hover{background:#35677b}#save-manager small{color:#b8d6db}@media(max-width:600px){#save-manager{left:8px;right:8px;bottom:8px}#save-manager strong{width:100%}#save-manager button{flex:1 1 auto}}';document.head.appendChild(style);
function saveStatus(msg){document.getElementById('save-status').textContent=msg}
function validSave(x){return x&&typeof x==='object'&&!Array.isArray(x)&&typeof x.name==='string'&&x.name.length<=200&&Number.isFinite(x.cash)&&Number.isFinite(x.wells)&&x.wells>=0&&x.wells<=100000&&Array.isArray(x.history)&&Array.isArray(x.events)&&Array.isArray(x.pending)&&typeof x.dead==='boolean'}
function downloadSave(){if(!s)return alert('Сначала создайте или загрузите карьеру');try{save();const data={format:'oil-management-save',version:1,exportedAt:new Date().toISOString(),game:s};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Oil_Management_save_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);saveStatus('Файл сохранения подготовлен')}catch(e){alert('Ошибка экспорта: '+e.message)}}
document.getElementById('save-now').onclick=()=>{if(!s)return alert('Нет активной карьеры');try{save();saveStatus('Сохранено: '+new Date().toLocaleTimeString('ru-RU'))}catch(e){alert('Не удалось сохранить: '+e.message)}};
document.getElementById('save-export').onclick=downloadSave;
document.getElementById('save-import').onclick=()=>{fileInput.value='';fileInput.click()};
fileInput.onchange=async()=>{const file=fileInput.files&&fileInput.files[0];if(!file)return;if(file.size>15*1024*1024)return alert('Файл слишком большой (максимум 15 МБ)');try{const parsed=JSON.parse(await file.text());const incoming=parsed&&parsed.format==='oil-management-save'?parsed.game:parsed;if(!validSave(incoming))throw new Error('Неверная структура файла сохранения');if(!confirm('Загрузить карьеру «'+incoming.name+'»? Текущая карьера будет заменена; перед заменой создаётся резервная копия.'))return;const old=localStorage.getItem(KEY);if(old)localStorage.setItem(BACKUP_KEY,old);localStorage.setItem(KEY,JSON.stringify(incoming));s=incoming;tab='overview';show();$('load').classList.remove('hide');saveStatus('Карьера загружена: '+incoming.name)}catch(e){alert('Не удалось загрузить файл: '+e.message)}};
document.getElementById('save-restore').onclick=()=>{try{const raw=localStorage.getItem(BACKUP_KEY);if(!raw)return alert('Резервной копии пока нет');const restored=JSON.parse(raw);if(!validSave(restored))throw new Error('Резервная копия повреждена');if(!confirm('Восстановить предыдущую карьеру «'+restored.name+'»?'))return;const old=localStorage.getItem(KEY);localStorage.setItem(KEY,raw);if(old)localStorage.setItem(BACKUP_KEY,old);s=restored;tab='overview';show();saveStatus('Предыдущая карьера восстановлена')}catch(e){alert('Ошибка восстановления: '+e.message)}};
})();
</script></body></html>
