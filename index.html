етролеум"></label><label>Регион<input id="region" value="Сарытау"></label><label>Месторождение<input id="field" value="Каражол"></label><label>Начальный капитал<select id="capital"><option value="1500">1,5 млрд ₸</option><option value="5000" selected>5 млрд ₸</option><option value="15000">15 млрд ₸</option></select></label></div><div class="actions"><button class="btn" id="new">Создать компанию</button><button class="btn secondary hide" id="load">Продолжить игру</button></div></section><div id="game" class="hide"><section class="card"><small id="where" class="muted"></small><h1 id="title"></h1><div id="period" class="muted"></div><div id="stats" class="grid" style="margin-top:15px"></div><div class="actions"><button id="next" class="btn">Следующий месяц →</button></div></section><nav class="tabs" id="tabs"><button data-tab="overview" class="active">Обзор</button><button data-tab="dispatch">Диспетчерская</button><button data-tab="assetsTree">Объекты · ГУ · скважины</button><button data-tab="field">Месторождение</button><button data-tab="finance">Финансы</button><button data-tab="hse">HSE</button><button data-tab="plan">План добычи</button><button data-tab="contracts">Подрядчики</button><button data-tab="staff">Персонал · СП/ПСП</button><button data-tab="ecology">Экология</button><button data-tab="org">Структура</button><button data-tab="warehouse">Склад · МТО</button><button data-tab="equipment">Оборудование · ОТУ</button><button data-tab="workshops">Цеха · KPI</button><button data-tab="decisions">Решения · события</button><button data-tab="events">События</button></nav><section class="card" id="body"></section><button class="btn secondary" id="reset">Новая карьера</button></div><p class="muted" style="font-size:11px">Учебная игровая модель, не технический или финансовый расчёт.</p></main><script>
(()=>{const KEY='oil-management-v01';let s=null,tab='overview';const $=x=>document.getElementById(x),f=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(n),m=n=>f(n)+' млн ₸',esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),cl=(n,a,b)=>Math.min(b,Math.max(a,n)),r=(a,b)=>a+Math.random()*(b-a);function save(){localStorage.setItem(KEY,JSON.stringify(s))}function log(t){s.events.unshift('Месяц '+s.month+': '+t);s.events=s.events.slice(0,60)}function show(){$('setup').classList.add('hide');$('game').classList.remove('hide');render()}function row(a,b){return '<div class="row"><span class="muted">'+a+'</span><b>'+b+'</b></div>'}function stat(a,b){return '<div class="stat"><small>'+a+'</small><b>'+b+'</b></div>'}function action(t){const x={drill:[950,'Начато бурение скважины'],repair:[180,'Капитальный ремонт фонда'],service:[80,'Плановое техобслуживание'],hse:[65,'Обучение и профилактика HSE'],survey:[110,'Геологическое исследование']}[t];if(!x||s.cash<x[0])return alert('Недостаточно средств');s.cash-=x[0];if(t==='drill')s.pending.push(2);if(t==='repair'){s.condition=cl(s.condition+16,0,100);s.rate+=.5}if(t==='service')s.condition=cl(s.condition+10,0,100);if(t==='hse')s.safety=cl(s.safety+14,0,100);if(t==='survey')s.rate+=.15;log(x[1]+' — '+m(x[0]));save();render()}function next(){if(s.dead)return;s.month++;assetMonth();treeMonth();s.pending=s.pending.map(n=>n-1);let done=s.pending.filter(n=>n===0).length;s.pending=s.pending.filter(n=>n>0);for(let i=0;i<done;i++){if(Math.random()<.82){s.wells++;log('Новая скважина успешно запущена')}else log('Бурение не дало промышленного притока')}s.oil=cl(s.oil+r(-18,18),45,115);s.usd=cl(s.usd+r(-12,12),380,600);s.water=cl(s.water+r(.1,.8),0,95);s.condition=cl(s.condition-r(1.5,3),0,100);s.safety=cl(s.safety-r(.5,2),0,100);s.rate=cl(s.rate-r(.05,.2),2,30);let downtime=cl((100-s.condition)*.004,0,.65);if(Math.random()<(100-s.safety)*.0015){downtime+=.2;s.cash-=55;log('Инцидент: внеплановый простой, расходы 55 млн ₸')}ensureAssets();s.assets.wellList.forEach(w=>{w.health=Math.max(10,Math.round(w.health-(1+Math.random()*3)));w.water=Math.min(95,Math.round(w.water+Math.random()*1.3));w.rate=Math.max(1,Math.round((w.rate-.08-Math.random()*.12)*10)/10)});let activeRatio=s.assets.wellList.filter(w=>w.status==='Работает').length/Math.max(1,s.wells);s.volume=s.wells*s.rate*30*(1-s.water/100)*(1-downtime)*activeRatio;s.revenue=s.volume*7.3*s.oil*s.usd/1e6*.79;s.expense=s.wells*7.5+45+s.volume*.006;s.profit=s.revenue-s.expense;s.cash+=s.profit;s.history.push({volume:s.volume,profit:s.profit});enterpriseMonth();opsMonth();if(s.enterprise&&s.enterprise.hr)hrMonth();if(s.cash<0){s.dead=true;log('Неплатёжеспособность: карьера завершена')}save();render()}function ensureAssets(){if(!s.assets)s.assets={};if(!s.assets.wellList)s.assets.wellList=[];while(s.assets.wellList.length<s.wells){let n=s.assets.wellList.length+1;s.assets.wellList.push({id:1000+n,unit:'ГУ-'+(1+Math.floor((n-1)/4)),status:'Работает',rate:Math.round((s.rate||18)*(0.75+Math.random()*.5)*10)/10,water:Math.round(Math.min(95,Math.max(2,(s.water||28)+(Math.random()-.5)*18))),health:Math.round(Math.min(100,Math.max(20,(s.condition||88)+(Math.random()-.5)*22)))})}if(s.assets.wellList.length>s.wells)s.assets.wellList.length=s.wells;if(!s.assets.infrastructure)s.assets.infrastructure=[{id:'ГУ-1',type:'Групповая установка',health:92},{id:'ГУ-2',type:'Групповая установка',health:88},{id:'ГУ-3',type:'Групповая установка',health:90},{id:'ДНС-1',type:'Дожимная насосная станция',health:86},{id:'ЦППН',type:'Подготовка нефти',health:91},{id:'ППД-1',type:'Поддержание пластового давления',health:83}];}function dispatchAction(id,act){ensureAssets();let w=s.assets.wellList.find(x=>x.id===Number(id));if(!w)return;let cost=act==='repair'?42:act==='stop'?0:0;if(s.cash<cost)return alert('Недостаточно средств');if(act==='repair'){s.cash-=cost;w.health=Math.min(100,w.health+35);w.status='Работает';log('Ремонт скважины №'+id+' — '+m(cost))}if(act==='stop'){w.status=w.status==='Остановлена'?'Работает':'Остановлена';log('Скважина №'+id+': '+w.status)}save();render()}function dispatchView(){ensureAssets();let a=s.assets.wellList,active=a.filter(w=>w.status==='Работает').length,avg=(k)=>a.length?(a.reduce((n,w)=>n+w[k],0)/a.length).toFixed(1):'0';let out='<div class="dispatch-head"><div><h2 style="margin:0">Диспетчерская месторождения</h2><p class="muted">Оперативная модель · данные игрового месяца</p></div><span class="live-dot">● СИМУЛЯЦИЯ</span></div><div class="dispatch-kpis"><div><small>Фонд скважин</small><strong>'+a.length+'</strong></div><div><small>В работе</small><strong>'+active+'</strong></div><div><small>Средний дебит</small><strong>'+avg('rate')+' т/сут</strong></div><div><small>Средняя обводнённость</small><strong>'+avg('water')+'%</strong></div></div><h3>Производственные объекты</h3><div class="asset-grid">'+s.assets.infrastructure.map(o=>'<div class="asset"><div class="asset-top"><b>'+esc(o.id)+'</b><span class="good">● В работе</span></div><small>'+esc(o.type)+'</small><div class="meter"><i style="width:'+o.health+'%"></i></div><small>Готовность оборудования '+o.health+'%</small></div>').join('')+'</div><h3>Реестр скважин</h3><div class="table-scroll"><table class="well-table"><thead><tr><th>№</th><th>Объект</th><th>Статус</th><th>Дебит, т/сут</th><th>Вода, %</th><th>Состояние, %</th><th>Управление</th></tr></thead><tbody>'+a.map(w=>'<tr><td><b>'+w.id+'</b></td><td>'+esc(w.unit)+'</td><td><span class="'+(w.status==='Работает'?'good':'warn')+'">● '+w.status+'</span></td><td>'+w.rate.toFixed(1)+'</td><td>'+w.water+'</td><td><div class="mini-meter"><i style="width:'+w.health+'%"></i></div>'+w.health+'%</td><td><button class="mini-btn" data-well="'+w.id+'" data-op="stop">'+(w.status==='Работает'?'Остановить':'Запустить')+'</button> <button class="mini-btn" data-well="'+w.id+'" data-op="repair" '+(s.cash<42?'disabled':'')+'>Ремонт · 42 млн ₸</button></td></tr>').join('')+'</tbody></table></div><div class="notice">Показатели скважин и готовности объектов — учебная модель. Для расчёта финансов используется агрегированная модель версии 0.1; остановка скважин отражается в добыче при переходе к следующему месяцу.</div>';return out}

function enterpriseMonth(){let e=ensureEnterprise();let report=[];for(let c of e.contractors){if(c.status!=='В работе')continue;let late=Math.random()<cl((100-e.audit)*.003+.05,.04,.3);if(late){let penalty=Math.round(c.price*.05*10)/10;c.penalty+=penalty;e.fines+=penalty;s.cash+=penalty;report.push('Просрочка договора №'+c.id+' — начислена неустойка '+m(penalty));continue}c.remaining--;if(c.remaining<=0){c.status='Завершён';let t=CONTRACT_TYPES[c.type];let final=t.cost-c.paid;s.cash-=final;c.paid=t.cost;if(c.type==='drill'){s.wells++;report.push('Бурение по договору №'+c.id+' завершено: введена скважина')}if(c.type==='prs'){s.rate+=.25;s.condition=cl(s.condition+3,0,100);report.push('ПРС: восстановлен дебит')}if(c.type==='krs'){s.rate+=.6;s.condition=cl(s.condition+8,0,100);report.push('КРС: восстановлена производительность')}if(c.type==='env')e.environment=cl(e.environment+12,0,100);if(c.type==='maint')s.condition=cl(s.condition+12,0,100);report.push('Договор №'+c.id+' исполнен')}}e.training=cl(e.training-1.5,0,100);e.environment=cl(e.environment-1.3,0,100);e.industrial=cl(e.industrial-1.2,0,100);e.audit=cl(e.audit-.7,0,100);let payroll=e.staff*.14;s.cash-=payroll;s.expense+=payroll;let envRisk=(100-e.environment)*.0018,indRisk=(100-e.industrial)*.0016;if(Math.random()<envRisk){let fine=35+Math.round(Math.random()*75);s.cash-=fine;e.fines+=fine;report.push('Экологическое нарушение: штраф '+m(fine));s.safety=cl(s.safety-3,0,100)}if(Math.random()<indRisk){let fine=45+Math.round(Math.random()*95);s.cash-=fine;e.fines+=fine;report.push('Нарушение промышленной безопасности: штраф '+m(fine));s.condition=cl(s.condition-4,0,100)}e.emissions=Math.round((s.volume||0)*.035);e.waste=Math.round((s.volume||0)*.007);e.report=[{month:s.month,plan:e.target,actual:Math.round(s.volume),pct:e.target?Math.round(s.volume/e.target*100):0,payroll,fines:e.fines},...e.report].slice(0,24);for(let x of report)log(x);if(report.length===0)log('Производственный цикл завершён без новых договорных function treeBind(){document.querySelectorAll('[data-tree-shop]').forEach(b=>b.onclick=()=>{treeShop=Number(b.dataset.treeShop);treeWell=null;render()});document.querySelectorAll('[data-tree-unit]').forEach(b=>b.onclick=()=>{treeUnit=b.dataset.treeUnit;treeWell=null;render()});document.querySelectorAll('[data-tree-filter]').forEach(b=>b.onclick=()=>{treeFilter=b.dataset.treeFilter;render()});document.querySelectorAll('[data-tree-action]').forEach(b=>b.onclick=()=>treeAction(b.dataset.treeId,b.dataset.treeAction))}

function render() {normalizeFiction();ensureTree();ensureOperations();ensurePlant();ensureAssets();ensureEnterprise();$('title').textContent=s.name;$('where').textContent=s.region+' · '+s.field;$('period').textContent=new Date(2026,s.month,1).toLocaleDateString('ru-RU',{month:'long',year:'numeric'})+' · '+s.wells+' скважин';$('stats').innerHTML=stat('Денежные средства',m(s.cash))+stat('Добыча / месяц',f(s.volume)+' т')+stat('Прибыль / месяц',m(s.profit))+stat('Нефть', '$'+f(s.oil)+'/барр.');$('next').disabled=s.dead;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let h='';if(tab==='dispatch')h=dispatchView();if(tab==='assetsTree')h=treeView();if(tab==='workshops')h=opsView();if(tab==='decisions')h=decisionsView();if(['plan','contracts','ecology','org'].includes(tab))h=enterpriseView();if(tab==='staff')h=hrView();if(tab==='warehouse')h=warehouseView();if(tab==='equipment')h=equipmentView();if(tab==='overview'){h='<h2>Панель директора</h2>'+row('Скважины',s.wells)+row('Обводнённость',f(s.water)+'%')+row('Состояние оборудования',f(s.condition)+'%')+row('Индекс HSE',f(s.safety)+'%')+'<h2>Добыча за последние 12 месяцев</h2>';let a=s.history.slice(-12),max=Math.max(1,...a.map(x=>x.volume));h+=a.length?'<div class="bars">'+a.map(x=>'<div title="'+f(x.volume)+' тонн" style="height:'+Math.max(2,x.volume/max*100)+'%"></div>').join('')+'</div>':'<p class="muted">Нажми «Следующий месяц», чтобы получить первый результат.</p>';h+='<div class="notice">'+esc(s.events[0])+'</div>'}if(tab==='field')h='<h2>Месторождение «'+esc(s.field)+'»</h2>'+row('Действующие скважины',s.wells)+row('Потенциальный дебит',f(s.rate)+' т/сут на скважину')+row('Обводнённость',f(s.water)+'%')+row('Техническое состояние',f(s.condition)+'%')+row('Бурение в работе',s.pending.length)+'<p class="muted">Новая скважина строится два месяца и имеет геологический риск.</p><div class="actions">'+btn('drill','Бурение',950)+btn('repair','Капремонт',180)+btn('service','ТО',80)+btn('survey','Геология',110)+'</div>';if(tab==='finance')h='<h2>Финансовый отчёт</h2>'+row('Выручка',m(s.revenue))+row('Операционные расходы',m(s.expense))+row('Прибыль',m(s.profit))+row('Денежные средства',m(s.cash))+row('USD/KZT',f(s.usd))+'<div class="notice">Упрощённая экономика: цена нефти, курс, добыча, условная доля реализации и расходы. Налоги, амортизация и лицензирование пока не моделируются.</div>';if(tab==='hse')h='<h2>Безопасность и надёжность</h2>'+row('Индекс HSE',f(s.safety)+'%')+row('Состояние оборудования',f(s.condition)+'%')+'<p class="muted">Износ увеличивает простои, слабая профилактика повышает вероятность инцидентов.</p><div class="actions">'+btn('hse','Профилактика HSE',65)+btn('service','Плановое ТО',80)+'</div>';if(tab==='events')h='<h2>Журнал событий</h2>'+s.events.map(x=>'<div class="row">'+esc(x)+'</div>').join('');if(s.dead)h='<div class="notice bad">Компания неплатёжеспособна. Начни новую карьеру.</div>'+h;$('body').innerHTML=h;if(tab==='staff')hrBind();if(tab==='assetsTree')treeBind();if(tab==='workshops'||tab==='decisions')opsBind();if(tab==='warehouse'||tab==='equipment')assetBind();document.querySelectorAll('[data-enterprise]').forEach(b=>b.onclick=()=>enterpriseAct(b.dataset.enterprise,b.dataset.arg));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-well]').forEach(b=>b.onclick=()=>dispatchAction(b.dataset.well,b.dataset.op))}function btn(t,label,cost){return '<button class="btn secondary" data-action="'+t+'" '+(s.cash<cost||s.dead?'disabled':'')+'>'+label+' · '+m(cost)+'</button>'}$('new').onclick=()=>{if(s&&!confirm('Заменить текущую карьеру?'))return;s={name:$('name').value.trim()||'Моя компания',region:$('region').value.trim()||'Мой регион',field:$('field').value.trim()||'Моё месторождение',cash:+$('capital').value,month:0,wells:12,rate:18,water:28,condition:88,safety:82,oil:75,usd:475,volume:0,revenue:0,expense:0,profit:0,pending:[],history:[],events:['Компания создана'],dead:false};save();show()};$('load').onclick=()=>{try{s=JSON.parse(localStorage.getItem(KEY));show()}catch(e){alert('Не удалось открыть сохранение')}};$('next').onclick=next;$('reset').onclick=()=>{if(confirm('Вернуться к созданию компании?')){$('game').classList.add('hide');$('setup').classList.remove('hide');$('load').classList.remove('hide')}};$('tabs').onclick=e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render()}};if(localStorage.getItem(KEY))$('load').classList.remove('hide')})();
</script></body></html>
